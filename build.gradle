	plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
    maven {
        name = "Ladysnake Mods"
        url = 'https://maven.ladysnake.org/releases'
    }
	maven { 
		url = "https://maven.shedaniel.me/"
	}
	maven { 
		url = "https://maven.terraformersmc.com/releases/"
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"seven-elements" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
	
	accessWidenerPath = file("src/main/resources/seven-elements.classtweaker")
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Cloth Config by shedaniel 
	implementation ("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    include implementation ("org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}")
    include implementation ("org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}")
	include implementation ("org.ladysnake.cardinal-components-api:cardinal-components-item:${project.cca_version}")
	
	// compileOnly "com.github.Fourmisain:TaxFreeLevels:${project.tax_free_levels_version}"
	compileOnly "maven.modrinth:tax-free-levels:${project.tax_free_levels_version}" // Above dependency has a JitPack error

}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet') // optional

	options.links("https://maven.fabricmc.net/docs/fabric-api-${project.fabric_api_version}/")
	options.links("https://maven.fabricmc.net/docs/fabric-loader-${project.loader_version}/")
	options.memberLevel = JavadocMemberLevel.PRIVATE;
}

tasks.withType(JavaExec).configureEach {
    // Only apply this to Fabric's run tasks
    if (name.contains("runClient") || name.contains("runServer")) {
        classpath = classpath.filter { file ->
            // Filter out files that belong to the compileOnly configuration
            !configurations.compileOnly.contains(file) && 
            !configurations.modCompileOnly.contains(file)
        }
    }
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE.md") {
		rename { "LICENSE_${inputs.properties.archivesName}"}
	}
}

tasks.named('jar') {
    archiveFileName.set("${project.archives_base_name}-${project.version}+${project.minecraft_version}.jar")
}

tasks.named('sourcesJar') {
    archiveFileName.set("${project.archives_base_name}-${project.version}+${project.minecraft_version}-sources.jar")
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}